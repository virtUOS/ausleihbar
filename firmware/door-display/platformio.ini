;
; Firmware for the e-ink door displays (Elecrow CrowPanel ESP32-S3 e-paper).
;   pio run -e small    2.13" panel (122x250, used as 250x122), SSD1680
;   pio run -e small_jd 2.13" panel, later board revision with JD79661
;   pio run -e wide     5.79" panel (792x272), two cascaded SSD1683

[platformio]
default_envs = small, wide
; Optional, git-ignored; missing files are skipped (glob), so CI builds work.
extra_configs = secrets.ini

; Placeholder values, overridden by secrets.ini.
[secrets]
wifi_ssid = door-displays
wifi_pass = change-me
server_url = https://ausleihbar.example.org
dev_flags =

[env]
platform = platformio/espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3 N8R8: 8 MB quad flash, 8 MB octal PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    '-DWIFI_SSID="${secrets.wifi_ssid}"'
    '-DWIFI_PASS="${secrets.wifi_pass}"'
    '-DSERVER_URL="${secrets.server_url}"'
    '-DFIRMWARE_VERSION="door-display/0.1.0"'
    ${secrets.dev_flags}
build_src_filter = +<*>

[env:small]
build_flags =
    ${env.build_flags}
    -DBOARD_SMALL=1
    -DSMALL_CONTROLLER_JD79661=0

[env:small_jd]
build_flags =
    ${env.build_flags}
    -DBOARD_SMALL=1
    -DSMALL_CONTROLLER_JD79661=1

[env:wide]
build_flags =
    ${env.build_flags}
    -DBOARD_WIDE=1
