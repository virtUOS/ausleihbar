# SPDX-License-Identifier: Apache-2.0
# Dependabot version updates: one weekly pull request per ecosystem with all
# minor and patch updates; major updates come as separate pull requests.
# Security updates (switched on in the repository settings) are independent
# of this schedule and arrive as soon as an advisory is published.
# Not covered: the basicbar packages (archive URLs in backend/requirements.txt
# and frontend/package.json) — bump those by hand per basicbar's CHANGELOG.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /website
    schedule:
      interval: weekly
    groups:
      website-minor-patch:
        update-types: [minor, patch]
    ignore:
      # MkDocs 2 is incompatible with Material (see website/requirements.txt).
      - dependency-name: mkdocs
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades that need a deliberate migration, not a bump: React 19
      # (react, react-dom and their types together), Vite 8 (with
      # @vitejs/plugin-react 6) and TypeScript 7. Only majors are ignored;
      # minor/patch and security fixes within the current major still come.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: vite
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
